  <style>
    :root {
      --brand: #0B5CAD;
      --ink: #15171a;
      --muted: #626a75;
      --page: #eef2f7;
      --card: #fff;
      --line: #d7dce4;
      --shadow: 0 24px 64px rgba(24, 39, 58, .14);
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 30px 20px;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      background:
        radial-gradient(circle at 50% -10%, rgba(11, 92, 173, .16), transparent 38%),
        var(--page);
    }

    main { width: min(100%, 620px); }

    .card {
      padding: 48px 42px 42px;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 30px;
      box-shadow: var(--shadow);
    }

    .brand-logo {
      display: block;
      width: 118px;
      height: 118px;
      object-fit: contain;
      margin: 0 auto 18px;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--brand);
      font-size: 14px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(38px, 8vw, 58px);
      line-height: 1.02;
      letter-spacing: -.045em;
      font-weight: 800;
    }

    .lead {
      max-width: 500px;
      margin: 22px auto 34px;
      color: var(--muted);
      font-size: clamp(18px, 3.5vw, 22px);
      line-height: 1.55;
    }

    .stores {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 16px 18px;
    }

    .store-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      text-decoration: none;
      transition: transform 150ms ease, filter 150ms ease;
    }

    .store-link:hover { transform: translateY(-2px); filter: brightness(1.06); }
    .store-link:active { transform: translateY(0); }
    .store-link:focus-visible { outline: 4px solid rgba(11, 92, 173, .22); outline-offset: 4px; }

    .apple-badge { display: block; width: 188px; height: auto; }
    .google-badge { display: block; width: 218px; height: auto; }

    footer {
      margin-top: 18px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    footer a { color: inherit; text-underline-offset: 3px; }

    @media (max-width: 560px) {
      body { padding: 18px 14px; }
      .card { padding: 36px 22px 32px; border-radius: 24px; }
      .brand-logo { width: 104px; height: 104px; }
      .lead { margin-bottom: 28px; }
      .stores { flex-direction: column; gap: 8px; }
      .apple-badge { width: 190px; }
      .google-badge { width: 220px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .store-link { transition: none; }
    }
  </style>
