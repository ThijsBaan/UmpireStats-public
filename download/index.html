<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B5CAD">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Download UmpireStats voor iPhone of Android.">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Download UmpireStats">
  <meta property="og:description" content="Houd je wedstrijden, reflecties en statistieken overzichtelijk bij met UmpireStats.">
  <meta property="og:url" content="https://umpirestats.nl/download/">

  <link rel="canonical" href="https://umpirestats.nl/download/">
  <title>Download UmpireStats</title>

  <script>
    (() => {
      const stores = {
        ios: 'https://apps.apple.com/nl/app/umpirestats/id6804798198',
        android: 'https://play.google.com/store/apps/details?id=nl.baan.umpirestats'
      };

      const ua = navigator.userAgent || '';
      const platform = navigator.userAgentData?.platform || navigator.platform || '';
      const isAndroid = /android/i.test(ua) || /android/i.test(platform);
      const isIOS = /iPad|iPhone|iPod/i.test(ua)
        || (/Mac/i.test(platform) && navigator.maxTouchPoints > 1);

      if (isAndroid) {
        window.location.replace(stores.android);
      } else if (isIOS) {
        window.location.replace(stores.ios);
      }
    })();
  </script>

  <style>
    :root {
      --primary: #0B5CAD;
      --primary-dark: #06447F;
      --primary-soft: #D8E8FF;
      --ink: #191C20;
      --muted: #5F6670;
      --surface: #FFFFFF;
      --background: #F4F6F9;
      --border: #DDE2E8;
      --shadow: 0 20px 55px rgba(25, 28, 32, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--background);
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% 0%, rgba(11, 92, 173, 0.12), transparent 42%),
        var(--background);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    main {
      width: min(100%, 520px);
    }

    .card {
      padding: 42px 38px 34px;
      text-align: center;
      background: color-mix(in srgb, var(--surface) 96%, transparent);
      border: 1px solid rgba(195, 199, 207, 0.8);
      border-radius: 28px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .app-icon {
      width: 88px;
      height: 88px;
      margin: 0 auto 24px;
      display: grid;
      place-items: center;
      border-radius: 23px;
      background: linear-gradient(145deg, #1472CC, var(--primary));
      box-shadow: 0 12px 28px rgba(11, 92, 173, 0.28);
      color: #fff;
    }

    .app-icon svg {
      width: 51px;
      height: 51px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--primary);
      font-size: 13px;
      font-weight: 750;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 7vw, 40px);
      line-height: 1.08;
      letter-spacing: -0.035em;
    }

    .lead {
      max-width: 400px;
      margin: 16px auto 30px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.55;
    }

    .store-list {
      display: grid;
      gap: 12px;
    }

    .store-button {
      min-height: 66px;
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 12px 18px;
      color: #fff;
      background: #111317;
      border: 1px solid #111317;
      border-radius: 16px;
      text-align: left;
      text-decoration: none;
      transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    .store-button:hover {
      transform: translateY(-2px);
      background: #25282D;
      box-shadow: 0 10px 24px rgba(17, 19, 23, 0.18);
    }

    .store-button:active {
      transform: translateY(0);
    }

    .store-button:focus-visible {
      outline: 3px solid var(--primary-soft);
      outline-offset: 3px;
    }

    .store-button svg {
      width: 30px;
      height: 30px;
      flex: 0 0 auto;
      fill: currentColor;
    }

    .store-copy {
      display: grid;
      gap: 1px;
    }

    .store-kicker {
      font-size: 11px;
      line-height: 1.2;
      opacity: 0.82;
    }

    .store-name {
      font-size: 20px;
      font-weight: 650;
      line-height: 1.2;
      letter-spacing: -0.015em;
    }

    .hint {
      margin: 22px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    footer {
      margin-top: 18px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }

    footer a {
      color: inherit;
      text-underline-offset: 3px;
    }

    @media (max-width: 520px) {
      body {
        padding: 20px 16px;
      }

      .card {
        padding: 34px 22px 28px;
        border-radius: 24px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #E1E2E8;
        --muted: #B5BAC2;
        --surface: #15171C;
        --background: #0F1115;
        --border: #43474E;
        --shadow: 0 22px 60px rgba(0, 0, 0, 0.38);
      }

      body {
        background:
          radial-gradient(circle at 50% 0%, rgba(167, 200, 255, 0.13), transparent 42%),
          var(--background);
      }

      .card {
        background: rgba(21, 23, 28, 0.94);
        border-color: var(--border);
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="title">
      <div class="app-icon" aria-hidden="true">
        <svg viewBox="0 0 64 64" role="img">
          <path d="M16 12v25.5C16 47.2 22.7 54 32 54s16-6.8 16-16.5V12h-8v25.1c0 5.6-3.1 9.1-8 9.1s-8-3.5-8-9.1V12h-8Z" fill="currentColor"/>
          <path d="M24 12h16v7H24z" fill="currentColor" opacity=".72"/>
        </svg>
      </div>

      <p class="eyebrow">UmpireStats</p>
      <h1 id="title">Download de app</h1>
      <p class="lead">Houd je wedstrijden, reflecties en statistieken overzichtelijk bij. Kies jouw platform om UmpireStats gratis te downloaden.</p>

      <div class="store-list" aria-label="Downloadmogelijkheden">
        <a class="store-button" href="https://apps.apple.com/nl/app/umpirestats/id6804798198" aria-label="Download UmpireStats in de App Store">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.28.07 2.17.7 2.92.75 1.12-.23 2.19-.89 3.39-.8 1.44.12 2.52.68 3.24 1.71-2.97 1.78-2.27 5.69.46 6.79-.55 1.45-1.27 2.89-2.01 4.52ZM12.03 7.25C11.88 5.1 13.63 3.33 15.63 3c.28 2.48-2.25 4.34-3.6 4.25Z"/>
          </svg>
          <span class="store-copy">
            <span class="store-kicker">Download in de</span>
            <span class="store-name">App Store</span>
          </span>
        </a>

        <a class="store-button" href="https://play.google.com/store/apps/details?id=nl.baan.umpirestats" aria-label="Download UmpireStats via Google Play">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3.6 2.4c-.37.42-.6 1.07-.6 1.9v15.4c0 .83.23 1.48.6 1.9l.08.08L12.3 13v-2L3.68 2.32l-.08.08Zm11.58 13.48-2.88-2.9v-1.96l2.88-2.9.07.04 3.42 1.94c.98.55.98 1.46 0 2.02l-3.42 1.94-.07.04v1.78Zm-.93.53-2.97-2.99-7.5 7.5c.47.5 1.25.56 2.13.07l8.34-4.58Zm0-8.82L5.91 3.01c-.88-.49-1.66-.43-2.13.07l7.5 7.5 2.97-2.99Z"/>
          </svg>
          <span class="store-copy">
            <span class="store-kicker">Download via</span>
            <span class="store-name">Google Play</span>
          </span>
        </a>
      </div>

      <p class="hint">Op iPhone, iPad en Android openen we automatisch de juiste app store.</p>
    </section>

    <footer>
      <a href="/privacy/">Privacy</a>
    </footer>
  </main>
</body>
</html>
